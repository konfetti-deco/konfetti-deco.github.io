<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a4b94">
<meta name="app-version" content="bus-v6">
<title>Автобус Schanz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f3f3f5; --card:#fff; --text:#1d1d1f; --muted:#6b6b72; --accent:#7a4b94;
          --ok:#2e7d32; --late:#c62828; --warn:#a15c00; --line:#e3e3e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1f1f23; --text:#f2f2f5; --muted:#a0a0a8; --line:#33333a;
            --ok:#66bb6a; --late:#ef5350; --warn:#ffb74d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent; }
  header { padding:14px 14px 6px; }
  h1 { font-size:18px; margin:0 0 10px; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--text);
         border-radius:12px; padding:12px 8px; font-size:15px; font-weight:600; cursor:pointer; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .status { display:flex; justify-content:space-between; align-items:center; gap:8px;
            padding:10px 14px; font-size:13px; color:var(--muted); }
  .status button { border:1px solid var(--line); background:var(--card); color:var(--text);
                   border-radius:10px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .banner { margin:0 14px 8px; padding:10px 12px; border-radius:10px; font-size:14px;
            background:#fff4e5; color:#7a4300; display:none; }
  @media (prefers-color-scheme: dark) { .banner { background:#3a2a10; color:#ffcc80; } }
  ul { list-style:none; margin:0; padding:0 14px 14px; }
  li { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:8px;
       display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center; }
  li.cancelled { opacity:.55; }
  li.cancelled .when { text-decoration:line-through; }
  .badge { background:var(--accent); color:#fff; font-weight:700; border-radius:8px;
           padding:6px 8px; min-width:44px; text-align:center; font-size:15px; grid-row:span 2; }
  .when { font-size:20px; font-weight:700; }
  .in { font-size:20px; font-weight:700; text-align:right; }
  .sub { font-size:13px; color:var(--muted); grid-column:2 / 4; }
  .rt-ok { color:var(--ok); } .rt-late { color:var(--late); } .rt-none { color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:30px 14px; }
  footer { font-size:12px; color:var(--muted); padding:4px 14px 24px; line-height:1.5; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🚌 Автобусы Aachen</h1>
  <div class="tabs" id="tabs"></div>
</header>
<div class="status">
  <span id="status">Загрузка…</span>
  <button id="refresh" type="button">↻ Обновить</button>
</div>
<div class="banner" id="banner"></div>
<ul id="list"></ul>
<footer>
  Данные: <a href="https://transitous.org/sources/" target="_blank" rel="noopener">Transitous</a>
  (расписание и реальное время DELFI / AVV). Время в Германии.<br>
  <span class="rt-ok">●</span> реальное время &nbsp; <span class="rt-none">●</span> только расписание<br>
  Исходный код: <a href="https://github.com/konfetti-deco/konfetti-deco.github.io/tree/main/bus" target="_blank" rel="noopener">github.com/konfetti-deco/…/bus</a>
</footer>

<script>
"use strict";

// ===== Настройки: остановки и направления =====
// name    — как показывать;
// query   — что искать в справочнике остановок;
// match   — имя найденной остановки обязано подходить под это правило
//           (так "Schanz (Jakobstraße)" не перепутается с другой "Schanz").
const STOPS = {
  schanz:      { name: "Schanz",      query: "Schanz (Jakobstraße) Aachen", match: /schanz.*jakob/i },
  bushof:      { name: "Bushof",      query: "Bushof Aachen",               match: /bushof/i },
  kaiserplatz: { name: "Kaiserplatz", query: "Kaiserplatz Aachen",          match: /kaiserplatz/i },
};
const ROUTES = [
  ["schanz", "bushof"], ["bushof", "schanz"],
  ["schanz", "kaiserplatz"], ["kaiserplatz", "schanz"],
];

const API = "https://api.transitous.org";
const VERSIONS = ["v6", "v5", "v4", "v3", "v2", "v1"]; // версия API: пробуем по очереди, рабочую запоминаем
const AACHEN = "50.7753,6.0839";
const TZ = "Europe/Berlin";
const REFRESH_MS = 60_000;          // автообновление раз в минуту
const AUTO_REFRESH_LIMIT_MS = 20 * 60_000; // после 20 мин без касаний — пауза (бережём бесплатный сервер)
const TIMEOUT_MS = 12_000;
const STOP_CACHE_DAYS = 14;
const WINDOW_MIN = 45;              // показываем отправления на ближайшие 45 мин (минимум 30 рейсов с остановки)

// ===== Безопасный localStorage =====
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// ===== Сеть =====
// Ошибки помечаются: network — нет связи/таймаут; status — HTTP-код; apiError — сервер ответил осмысленной ошибкой.
async function getJSON(url) {
  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    let r;
    try {
      r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    } catch (e) {
      lastErr = Object.assign(new Error("network: " + e.message), { network: true });
      clearTimeout(t);
      if (attempt === 0) await new Promise(res => setTimeout(res, 1500));
      continue;
    }
    clearTimeout(t);
    if (r.ok) return await r.json();
    const err = new Error("HTTP " + r.status);
    err.status = r.status;
    try { const body = await r.json(); if (body && body.error) { err.apiError = true; err.message += ": " + body.error; } } catch {}
    if (r.status < 500) throw err;              // 4xx не повторяем
    lastErr = err;
    if (attempt === 0) await new Promise(res => setTimeout(res, 1500));
  }
  throw lastErr;
}

async function apiGet(endpoint, params) {
  const vk = "ver:" + endpoint;
  const known = store.get(vk);
  const order = known ? [known, ...VERSIONS.filter(v => v !== known)] : VERSIONS;
  let lastErr;
  for (const v of order) {
    try {
      const data = await getJSON(`${API}/api/${v}/${endpoint}?${params}`);
      if (v !== known) store.set(vk, v);
      return data;
    } catch (e) {
      lastErr = e;
      if (!(e.status === 404 && !e.apiError)) break;   // другая версия поможет только при «нет такого адреса»
    }
  }
  throw lastErr;
}

// ===== Поиск ID остановки (с кэшем) =====
async function resolveStop(key, force) {
  const ck = "stop3:" + key;
  const cached = store.get(ck);
  if (!force && cached && Date.now() - cached.t < STOP_CACHE_DAYS * 864e5) return cached.id;
  const s = STOPS[key];
  const url = `${API}/api/v1/geocode?type=STOP&numResults=20&place=${AACHEN}&text=${encodeURIComponent(s.query)}`;
  const res = await getJSON(url);
  // город именно Аахен (не Eschweiler, не Düren), немецкие данные (de-…) раньше бельгийских/нидерландских
  const inAachen = m => (m.areas || []).some(a => /^aachen$/i.test(a.name));
  const cands = (res || []).filter(m => s.match.test(m.name) && inAachen(m));
  const hit = cands.find(m => /^de-/.test(m.id)) || cands[0];
  if (!hit) throw new Error(`Остановка «${s.name}» не найдена`);
  store.set(ck, { id: hit.id, name: hit.name, t: Date.now() });
  return hit.id;
}

// ===== Способ 1 (основной): табло отправлений + следующие остановки каждого рейса =====
// Один запрос. Рейс берём, только если он после нашей остановки доезжает до остановки назначения.
async function boardTrips(fromId, fromKey, toKey, time) {
  const params = new URLSearchParams({
    stopId: fromId, time, n: "30", window: String(WINDOW_MIN * 60), mode: "BUS", fetchStops: "true",
  });
  const data = await apiGet("stoptimes", params);
  const list = (data && data.stopTimes) || [];
  if (list.length && !list.some(x => Array.isArray(x.nextStops))) {
    throw Object.assign(new Error("сервер не вернул следующие остановки"), { noStops: true });
  }
  const out = [];
  for (const x of list) {
    const p = x.place || {};
    if (!STOPS[fromKey].match.test(p.name || "")) continue;     // только наша остановка
    if (x.pickupDropoffType === "NOT_ALLOWED") continue;          // посадки нет
    const d = (x.nextStops || []).find(n => STOPS[toKey].match.test(n.name || ""));
    if (!d || !p.departure) continue;                             // не доезжает
    out.push({
      key: (x.routeShortName || "") + "|" + (p.scheduledDeparture || p.departure),
      line: x.routeShortName || x.displayName || "Bus",
      dep: p.departure, depSched: p.scheduledDeparture || p.departure,
      arr: d.arrival || d.departure,
      realTime: !!x.realTime,
      cancelled: !!(x.cancelled || x.tripCancelled || d.cancelled),
      headsign: x.headsign || "",
      track: p.track || p.scheduledTrack || "",
    });
  }
  return finalize(out);
}

// ===== Способ 2 (запасной): поиск маршрутов, только прямые автобусы =====
async function planTrips(fromKey, toKey, time) {
  const [fromId, toId] = await Promise.all([resolveStop(fromKey, false), resolveStop(toKey, false)]);
  const params = new URLSearchParams({
    fromPlace: fromId, toPlace: toId, time,
    maxTransfers: "0", transitModes: "BUS", searchWindow: String(WINDOW_MIN * 60), numItineraries: "10",
  });
  const data = await apiGet("plan", params);
  const out = [];
  for (const it of (data && data.itineraries) || []) {
    const tl = (it.legs || []).filter(l => l.mode !== "WALK");
    if (tl.length !== 1) continue;
    const l = tl[0];
    if (!STOPS[fromKey].match.test(l.from && l.from.name || "")) continue;
    if (!STOPS[toKey].match.test(l.to && l.to.name || "")) continue;
    out.push({
      key: (l.routeShortName || "") + "|" + l.scheduledStartTime,
      line: l.routeShortName || l.displayName || "Bus",
      dep: l.startTime, depSched: l.scheduledStartTime, arr: l.endTime,
      realTime: !!l.realTime, cancelled: !!l.cancelled,
      headsign: l.headsign || "", track: (l.from && (l.from.track || l.from.scheduledTrack)) || "",
    });
  }
  return finalize(out);
}

// Дубликаты (один рейс в нескольких наборах данных) убираем; рейсы «в обход по кольцу»
// (едут намного дольше самого быстрого) не показываем; сортируем по отправлению.
function finalize(out) {
  const seen = new Set();
  let uniq = out.filter(t => t.dep && t.arr && !seen.has(t.key) && seen.add(t.key));
  // один и тот же автобус, проходящий две платформы нашей остановки (одна линия, одно время прибытия):
  // оставляем более позднее отправление
  const byArr = new Map();
  for (const t of uniq) {
    const k = t.line + "|" + t.arr;
    const prev = byArr.get(k);
    if (!prev || new Date(t.dep) > new Date(prev.dep)) byArr.set(k, t);
  }
  uniq = [...byArr.values()];
  const ride = t => (new Date(t.arr) - new Date(t.dep)) / 60000;
  const rides = uniq.filter(t => !t.cancelled).map(ride).filter(m => m > 0);
  const min = rides.length ? Math.min(...rides) : 0;
  const limit = Math.max(2 * min, min + 8);
  return uniq.filter(t => !min || ride(t) <= limit)
             .sort((a, b) => new Date(a.dep) - new Date(b.dep));
}

// ===== Отображение =====
const $ = id => document.getElementById(id);
const fmt = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
const fmtS = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: TZ });
const hm = iso => fmt.format(new Date(iso));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let current = Math.min(Math.max(+store.get("route") || 0, 0), ROUTES.length - 1);
const state = {};       // по индексу направления: { trips, at }
let lastTouch = Date.now();
let timer = null;
const inflight = {};    // по индексу направления: идущая загрузка

function renderTabs() {
  $("tabs").innerHTML = ROUTES.map(([a, b], i) =>
    `<button type="button" class="tab${i === current ? " active" : ""}" data-i="${i}">${STOPS[a].name} → ${STOPS[b].name}</button>`
  ).join("");
}

function renderList() {
  const st = state[current];
  const list = $("list");
  if (!st) { list.innerHTML = `<div class="empty">Загрузка…</div>`; return; }
  const now = Date.now();
  const trips = st.trips.filter(t => new Date(t.dep).getTime() > now - 60_000);
  if (!trips.length) {
    list.innerHTML = `<div class="empty">В ближайшие 45 минут прямых автобусов нет.<br>Нажмите «Обновить» позже.</div>`;
    return;
  }
  list.innerHTML = trips.map(t => {
    const depMs = new Date(t.dep).getTime();
    const mins = Math.round((depMs - now) / 60000);
    const inTxt = t.cancelled ? "отмена" : mins <= 0 ? "сейчас" : mins + " мин";
    const delay = Math.round((depMs - new Date(t.depSched).getTime()) / 60000);
    let rt;
    if (t.cancelled) rt = `<span class="rt-late">● рейс отменён</span>`;
    else if (!t.realTime) rt = `<span class="rt-none">● по расписанию</span>`;
    else if (delay > 0) rt = `<span class="rt-late">● +${delay} мин (план ${hm(t.depSched)})</span>`;
    else if (delay < 0) rt = `<span class="rt-ok">● ${delay} мин (план ${hm(t.depSched)})</span>`;
    else rt = `<span class="rt-ok">● вовремя</span>`;
    return `<li class="${t.cancelled ? "cancelled" : ""}">
      <span class="badge">${esc(t.line)}</span>
      <span class="when">${hm(t.dep)}</span>
      <span class="in">${inTxt}</span>
      <span class="sub">${rt} · прибытие ${hm(t.arr)}${t.headsign ? " · → " + esc(t.headsign) : ""}${t.track ? " · стоянка " + esc(t.track) : ""}</span>
    </li>`;
  }).join("");
}

function setStatus(text) { $("status").textContent = text; }
function setBanner(text) { const b = $("banner"); b.textContent = text || ""; b.style.display = text ? "block" : "none"; }

function load(i) {
  if (i === current) setStatus("Обновление…");
  if (!inflight[i]) inflight[i] = doLoad(i).finally(() => { delete inflight[i]; });
  return inflight[i];
}

async function doLoad(i) {
  const [a, b] = ROUTES[i];
  try {
    const time = new Date(Date.now() - 60_000).toISOString();
    let trips;
    try {
      trips = await boardTrips(await resolveStop(a, false), a, b, time);
    } catch (e1) {
      if (e1.network) throw e1;                      // нет связи — сразу показываем сохранённое
      console.warn("способ 1:", e1);
      try {                                          // возможно, ID остановки поменялся — ищем заново
        trips = await boardTrips(await resolveStop(a, true), a, b, time);
      } catch (e2) {
        if (e2.network) throw e2;
        console.warn("способ 1, повтор:", e2);
        trips = await planTrips(a, b, time);         // запасной способ
      }
    }
    state[i] = { trips, at: Date.now() };
    store.set("cache2:" + i, state[i]);
    if (i === current) setBanner("");
  } catch (e) {
    if (i !== current) { console.error(e); return; }
    const cached = state[i] || store.get("cache2:" + i);
    if (cached) {
      state[i] = cached;
      setBanner(`Нет связи с сервером данных. Показаны данные от ${fmt.format(new Date(cached.at))} — время могло измениться.`);
    } else {
      setBanner("Не удалось загрузить данные. Проверьте интернет и нажмите «Обновить».");
      state[i] = { trips: [], at: 0 };
    }
    console.error(e);
  } finally {
    if (i === current) { renderList(); updateStatus(); }
  }
}

function updateStatus() {
  const st = state[current];
  if (!st || !st.at) { setStatus("Нет данных"); return; }
  const paused = Date.now() - lastTouch > AUTO_REFRESH_LIMIT_MS;
  setStatus(`Обновлено ${fmtS.format(new Date(st.at))}${paused ? " · автообновление на паузе" : ""}`);
}

function schedule() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (document.hidden) return;
    renderList();                                    // пересчёт «через N мин»
    const st = state[current];
    const stale = !st || Date.now() - st.at >= REFRESH_MS;
    if (stale && Date.now() - lastTouch < AUTO_REFRESH_LIMIT_MS) load(current);
    else updateStatus();
  }, 15_000);
}

function select(i) {
  current = i; store.set("route", i); lastTouch = Date.now();
  renderTabs();
  if (!state[i]) { const c = store.get("cache2:" + i); if (c) state[i] = c; }
  renderList(); updateStatus();
  load(i);
}

$("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab"); if (btn) select(+btn.dataset.i);
});
$("refresh").addEventListener("click", () => { lastTouch = Date.now(); load(current); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { lastTouch = Date.now(); load(current); }
});

renderTabs();
select(current);
schedule();
</script>
</body>
</html>
