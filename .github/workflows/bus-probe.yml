name: bus-probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bus-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="https://api.transitous.org"
          for s in be-tec_tec:s-aachenbushof de-AVV-Aachen_de:05334:1011:1:1 de-DELFI_de:05334:1015:1:1_G; do
            echo "=== platforms seen at $s"
            curl -sS -G "$A/api/v6/stoptimes" --data-urlencode "stopId=$s" --data-urlencode "n=60" | jq -c '[.stopTimes[].place | {stopId,parentId,name}] | unique'
          done
          plan() { curl -sS -G "$A/api/v6/plan" --data-urlencode "fromPlace=$1" --data-urlencode "toPlace=$2" --data-urlencode "maxTransfers=0" --data-urlencode "transitModes=BUS" --data-urlencode "searchWindow=3600" --data-urlencode "numItineraries=10" \
              | jq -r 'if .itineraries then (.itineraries[] | [.legs[] | select(.mode!="WALK") | "\(.routeShortName) \(.from.name) \(.startTime[11:16]) -> \(.to.name) \(.endTime[11:16])"] | join(" | ")) else . end'; }
          S=de-DELFI_de:05334:1015:1:1_G
          for K in de-DELFI_de:05334:1011 de-AVV-Aachen_de:05334:1011 de-DELFI_de:05334:1011:1:1_G de-DELFI_de:05334:1011_G; do
            echo "=== plan S -> $K"; plan $S $K | head -14
          done
          for B in de-DELFI_de:05334:1001 de-DELFI_de:05334:1001:1:1_G de-DELFI_de:05334:1001_G; do
            echo "=== plan S -> $B"; plan $S $B | head -14
          done
