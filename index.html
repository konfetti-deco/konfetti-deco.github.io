<style>
/* Layout: a glass tab bar stays on top; every tab is a column of soft raised cards over a warm, lightly tinted ground.
   In the constructor the scene stays in view while the controls scroll under it; on wide screens it becomes two columns. */
:root{
  --bg:#F2ECE1; --bg2:#E8DFCE; --surface:#FFFDF9; --surface2:#F2EBDD; --well:#EDE5D5; --glass:rgba(255,253,249,.74);
  --ink:#1D2320; --muted:#646357; --line:#DCD2BD; --hair:rgba(70,52,18,.12); --hi:rgba(255,255,255,.75);
  --accent:#1F4D3F; --accent2:#2D6B57; --accent-ink:#FFFFFF; --accent-soft:#DCE8E1; --brass:#8A691C; --chip:#EAE2D0;
  --tint1:rgba(201,168,87,.20); --tint2:rgba(47,107,85,.13);
  --ok:#1C6E46; --warn:#8A5A00; --bad:#B3261E; --dim:#A3451C; --wood:#C49A5E; --steel:#7F8C9B; --skin:#E9E4D8;
  --sh1:0 1px 2px rgba(60,44,12,.05),0 10px 28px -14px rgba(60,44,12,.22);
  --sh2:0 2px 4px rgba(60,44,12,.06),0 18px 44px -18px rgba(60,44,12,.32);
  --sh3:0 3px 8px rgba(60,44,12,.08),0 30px 60px -24px rgba(40,30,8,.42);
  --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Onest','Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --tabs-h:52px; --r:20px; --rc:13px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1210; --bg2:#151A16; --surface:#1A201C; --surface2:#232B25; --well:#141916; --glass:rgba(24,30,26,.72);
  --ink:#ECE7DA; --muted:#A6A497; --line:#364037; --hair:rgba(255,255,255,.09); --hi:rgba(255,255,255,.07);
  --accent:#7CC8A6; --accent2:#9BD9BC; --accent-ink:#0E1512; --accent-soft:#20332A; --brass:#D9BC74; --chip:#283029;
  --tint1:rgba(201,168,87,.10); --tint2:rgba(124,200,166,.08);
  --ok:#7CD4A4; --warn:#F0C36A; --bad:#FF9A8F; --dim:#F0A27A; --wood:#B98F56; --steel:#93A1B1; --skin:#2A312B;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --sh2:0 2px 4px rgba(0,0,0,.35),0 18px 44px -18px rgba(0,0,0,.7);
  --sh3:0 3px 8px rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.8); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1210; --bg2:#151A16; --surface:#1A201C; --surface2:#232B25; --well:#141916; --glass:rgba(24,30,26,.72);
  --ink:#ECE7DA; --muted:#A6A497; --line:#364037; --hair:rgba(255,255,255,.09); --hi:rgba(255,255,255,.07);
  --accent:#7CC8A6; --accent2:#9BD9BC; --accent-ink:#0E1512; --accent-soft:#20332A; --brass:#D9BC74; --chip:#283029;
  --tint1:rgba(201,168,87,.10); --tint2:rgba(124,200,166,.08);
  --ok:#7CD4A4; --warn:#F0C36A; --bad:#FF9A8F; --dim:#F0A27A; --wood:#B98F56; --steel:#93A1B1; --skin:#2A312B;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --sh2:0 2px 4px rgba(0,0,0,.35),0 18px 44px -18px rgba(0,0,0,.7);
  --sh3:0 3px 8px rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.8); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 8% -6%,var(--tint1),transparent 62%),radial-gradient(820px 520px at 104% 8%,var(--tint2),transparent 58%),linear-gradient(180deg,var(--bg),var(--bg2))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:600;font-variant-numeric:lining-nums;line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:28px} h3{font-size:22px}
p{margin:0 0 8px} p:last-child{margin-bottom:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn,.chip,.seg button,.tile,.pal,.sw,.tab,.thumb,.tpl,.gbtn,.cmyk-btn,.stp .sb{transition:transform .12s var(--ease),background-color .18s,box-shadow .18s,border-color .18s,color .18s,opacity .18s}

/* ---------- header and tabs ---------- */
.top{display:flex;align-items:flex-end;gap:10px;padding:16px 16px 10px;max-width:1280px;margin:0 auto}
.top .brand{flex:1;min-width:0}
.pname{display:block;width:100%;border:0;background:transparent;font-family:var(--f-display);font-weight:600;font-size:31px;line-height:1.1;padding:0;border-bottom:1px dashed transparent;font-variant-numeric:lining-nums;text-overflow:ellipsis}
.pname:hover,.pname:focus{border-bottom-color:var(--line);outline:none}
.top .acts{display:flex;gap:6px;flex:none}
body[data-tab=con] .top .acts .btn.ic{display:none}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-block:1px solid var(--hair);box-shadow:0 8px 24px -18px rgba(40,30,8,.5)}
.tabs .in{display:flex;gap:4px;align-items:center;height:var(--tabs-h);overflow-x:auto;scrollbar-width:none;max-width:1280px;margin:0 auto;padding:0 12px}
.tabs .in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;height:38px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:linear-gradient(180deg,var(--accent2),var(--accent));font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px -8px var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;opacity:.6;margin-right:6px}
main{max-width:1280px;margin:0 auto;padding-block:16px 90px;padding-inline:16px}

/* ---------- cards and common pieces ---------- */
.col{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.cols>*,.col>*,.con>*,.con-l>*,.con-r>*{min-width:0}
@media (min-width:1040px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.cols>.wide{grid-column:1/-1}}
[data-sec]:empty{display:none}
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--bg2)));border:1px solid var(--hair);border-radius:var(--r);padding:18px;box-shadow:inset 0 1px 0 var(--hi),var(--sh1)}
.card>.eyebrow{margin-bottom:2px}
.card>h2,.card>h3{margin-bottom:12px}
.card .lead{color:var(--muted);margin:-4px 0 12px;max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid.stats{margin-top:14px}
hr{border:0;border-top:1px solid var(--hair);margin:14px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 15px;border-radius:var(--rc);border:1px solid var(--hair);background:linear-gradient(180deg,var(--surface),var(--surface2));font-weight:500;font-size:14px;white-space:nowrap;box-shadow:inset 0 1px 0 var(--hi),0 1px 2px rgba(40,30,8,.08)}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.btn:active,.chip:active,.tile:active,.pal:active,.tpl:active,.gbtn:active,.thumb:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:transparent;color:var(--accent-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -10px var(--accent)}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px}
.btn.ic{width:44px;padding:0}
.btn.dng{color:var(--bad)}
.btn[disabled],.gbtn[disabled]{opacity:.38;cursor:default}
.btn svg,.gbtn svg{width:18px;height:18px;flex:none}
.up{position:relative;overflow:hidden;cursor:pointer}
.up input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>.fl{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{min-height:44px;border:1px solid var(--hair);border-radius:var(--rc);background:var(--surface);padding:0 12px;width:100%;min-width:0;box-shadow:inset 0 1px 2px rgba(40,30,8,.06)}
.fld textarea{padding:10px 12px;resize:vertical;line-height:1.4}
.stp{display:flex;align-items:stretch;height:44px;border:1px solid var(--hair);border-radius:var(--rc);overflow:hidden;background:var(--surface);box-shadow:inset 0 1px 2px rgba(40,30,8,.06)}
.stp input{flex:1;width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:14px;padding:0 2px;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp .sb{flex:none;width:38px;border:0;background:var(--surface2);font-size:19px;line-height:1;color:var(--ink)}
.stp .sb:active{background:var(--chip);transform:scale(.94)}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:calc(var(--rc) + 2px);background:var(--well);box-shadow:inset 0 1px 3px rgba(40,30,8,.12);max-width:100%}
.seg button{border:0;background:transparent;min-height:38px;padding:0 13px;font-size:13.5px;border-radius:calc(var(--rc) - 2px);white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -6px var(--accent)}
.seg.scroll{display:flex;overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:1 0 auto}
.tog{display:inline-flex;align-items:center;gap:9px;min-height:44px;cursor:pointer;font-size:14px}
.tog input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}
.togs{gap:4px 18px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:linear-gradient(180deg,var(--surface),var(--surface2));font-size:13.5px;white-space:nowrap;box-shadow:inset 0 1px 0 var(--hi)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:transparent;color:var(--accent-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px -8px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* colour */
.sws{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.sw{width:40px;height:40px;border-radius:50%;padding:0;flex:none;border:2px solid var(--surface);background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),var(--c,#888);box-shadow:0 0 0 1px var(--hair),0 3px 8px -3px rgba(40,30,8,.4)}
.sw.big{width:48px;height:48px}
.sw:hover{transform:translateY(-1px)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent),0 6px 12px -4px rgba(40,30,8,.45);transform:scale(1.06)}
.cmyk-btn{display:inline-flex;align-items:center;gap:9px;min-height:40px;padding:0 13px 0 6px;border-radius:999px;border:1px solid var(--hair);background:linear-gradient(180deg,var(--surface),var(--surface2));font-size:12.5px;box-shadow:inset 0 1px 0 var(--hi)}
.cmyk-btn i{width:28px;height:28px;border-radius:50%;border:1px solid var(--hair);flex:none}
.cmyk-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cmyk{margin-top:10px;padding:14px;border-radius:16px;background:var(--well);box-shadow:inset 0 1px 3px rgba(40,30,8,.12);display:flex;flex-direction:column;gap:10px;animation:pop .22s var(--ease)}
.cmyk.wheelp{flex-direction:row;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;padding:18px 14px}
.wh{position:relative;flex:0 0 auto;width:min(230px,100%);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;
  background:radial-gradient(closest-side,#fff,rgba(255,255,255,0)),conic-gradient(from 90deg,#f00,#f0f,#00f,#0ff,#0f0,#ff0,#f00);
  box-shadow:0 0 0 5px var(--surface),0 0 0 6px var(--hair),0 12px 26px -12px rgba(40,30,8,.55)}
.whd{position:absolute;inset:0;border-radius:50%;background:#000;opacity:calc((1 - var(--v,1))*.6);pointer-events:none}
.whl{position:absolute;left:50%;top:50%;height:0;border-top:2px dashed rgba(20,20,20,.6);transform-origin:0 50%;pointer-events:none;filter:drop-shadow(0 0 1px rgba(255,255,255,.7))}
.wht{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.62),0 4px 10px rgba(0,0,0,.4);pointer-events:none}
.whside{flex:1 1 230px;min-width:0;display:flex;flex-direction:column;gap:12px}
.whrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.whrow b,.kn b{font-weight:500;font-size:12px;color:var(--muted)}
.kn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kn label{display:flex;flex-direction:column;gap:3px;min-width:0}
.kn b{font-family:var(--f-mono);font-size:13px;padding-left:2px}
.cmyk input[type=number],.cmyk .hex input{height:40px;border:1px solid var(--hair);border-radius:11px;background:var(--surface);text-align:center;font-family:var(--f-mono);font-size:14px;width:100%;min-width:0;padding:0 4px}
.cmyk input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:pan-y}
.cmyk input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--g0),var(--g1));box-shadow:inset 0 0 0 1px var(--hair)}
.cmyk input[type=range]::-moz-range-track{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--g0),var(--g1));box-shadow:inset 0 0 0 1px var(--hair)}
.cmyk input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid #1F4D3F;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.cmyk input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #1F4D3F;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.cmyk .hexrow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.cmyk .hex{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:none}
.cmyk .hex input{width:104px}
.cmyk .hexrow>span{flex:1;min-width:160px}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid var(--hair);vertical-align:-1px;margin-right:6px;flex:none}
.dot.cham{background:linear-gradient(135deg,#F3B7CF,#CDB4F0,#A9E3DC,#F6D9B0)!important}

.stat{background:var(--well);border-radius:14px;padding:11px 13px;min-width:0;box-shadow:inset 0 1px 2px rgba(40,30,8,.08)}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.stat span{display:block;font-size:12px;line-height:1.3;color:var(--muted);margin-top:2px}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}

.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--hair);vertical-align:top}
table.t td.r,table.t th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.sum td{font-weight:600;border-bottom:0;background:var(--well)}
table.t tr.sum td:first-child{border-radius:10px 0 0 10px} table.t tr.sum td:last-child{border-radius:0 10px 10px 0}
table.t tr.grp td{background:var(--well);font-weight:600;border-bottom:0}
table.t .spec{display:block;color:var(--muted);font-size:12px;line-height:1.35}
table.t .pin{width:78px;height:36px;border:1px solid var(--hair);border-radius:10px;background:var(--surface);text-align:right;padding:0 8px;font-family:var(--f-mono);font-size:13px;box-shadow:inset 0 1px 2px rgba(40,30,8,.06)}
.pos{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;padding:0 5px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:10px}
.check b{color:var(--ok);flex:none}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.chk li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.chk li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--ok)}
.chk li.warn::before{content:"!";background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chk li.info::before{content:"i";background:var(--chip);color:var(--muted);font-family:var(--f-display);font-style:italic}
.chk li.bad::before{content:"!";background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
ul.pl{margin:0;padding-left:18px} ul.pl li{margin:4px 0}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--hair)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px}
ol.steps b{display:block} ol.steps .tm{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- modal, toast, motion ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,16,13,.42);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .2s ease both}
.modal{background:var(--surface);border-radius:26px 26px 0 0;width:100%;max-width:660px;max-height:88vh;overflow:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh3);animation:sheet .3s var(--ease) both}
@media (min-width:700px){.scrim{align-items:center;padding:20px}.modal{border-radius:26px;padding-bottom:24px}}
.modal h3{margin-bottom:12px}
.modal .x{float:right;margin:-4px -2px 0 8px}
.modal img{max-width:100%;border:1px solid var(--hair);border-radius:10px;display:block;margin:8px auto}
.modal textarea{width:100%;min-height:180px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);padding:8px;font-family:var(--f-mono);font-size:12px}
.mblock{margin:6px 0 16px}
.impwrap{text-align:center;margin:12px 0 4px}
.impbox{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:12px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair;
  background:repeating-conic-gradient(#D5D5D5 0 25%,#F3F3F3 0 50%) 0 0/20px 20px;box-shadow:var(--sh1)}
.impbox canvas{display:block;max-width:100%;max-height:46vh;width:auto;height:auto;border-radius:12px}
.cropclip{position:absolute;inset:0;overflow:hidden;border-radius:12px;pointer-events:none}
.crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 4000px rgba(10,14,12,.5)}
.croph{position:absolute;pointer-events:none}
.cph{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:auto;touch-action:none}
.cph::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff;border:3px solid #1F4D3F;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.cph.tl{left:0;top:0;cursor:nwse-resize} .cph.tr{left:100%;top:0;cursor:nesw-resize} .cph.bl{left:0;top:100%;cursor:nesw-resize} .cph.br{left:100%;top:100%;cursor:nwse-resize}
.phprev{max-height:38vh;width:auto;max-width:100%;border-radius:14px!important;box-shadow:var(--sh1)}
.phbusy{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--well);margin:12px 0}
.phbusy>div{flex:1;min-width:0} .phbusy b{display:block}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pherr{color:var(--bad);font-size:14px;margin:10px 0}
.modal .insp-grid{margin:12px 0}
.plist{display:flex;flex-direction:column;gap:7px}
.pitem{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--hair);border-radius:14px;background:var(--surface)}
.pitem .nm{flex:1;min-width:0} .pitem .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .pitem .nm small{color:var(--muted)}
.tpls{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin:6px 0 16px}
.tpl{border:1px solid var(--hair);border-radius:14px;padding:11px 13px;background:linear-gradient(180deg,var(--surface),var(--surface2));text-align:left;line-height:1.3;box-shadow:inset 0 1px 0 var(--hi)}
.tpl:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent)} .tpl b{display:block} .tpl small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .22s,transform .28s var(--ease);max-width:90vw;text-align:center;box-shadow:var(--sh2)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.4;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
#view.enter [data-sec]:not([data-sec=stage]){animation:rise .36s var(--ease) both}
#view.enter [data-sec]:nth-child(2){animation-delay:.04s} #view.enter [data-sec]:nth-child(3){animation-delay:.08s} #view.enter [data-sec]:nth-child(n+4){animation-delay:.12s}
.card.fresh{animation:pop .24s var(--ease)}
@media (max-width:420px){.pname{font-size:25px}.card{padding:15px 13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.spin{animation:spin 2s linear infinite!important}}

/* v14: how to move, the floating panel, live readings */
.stage-tools.m{left:50%;top:auto;bottom:10px;transform:translateX(-50%);gap:0;background:rgba(255,255,255,.88);border-radius:999px;padding:3px;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
.stage-tools.m .gbtn.mv{font-size:13px;font-weight:600;height:36px;padding:0 12px;gap:6px;border-radius:999px;background:transparent;box-shadow:none;color:#3b3f3c;display:inline-flex;align-items:center}
.stage-tools.m .gbtn.mv[aria-pressed="true"]{background:#1F4D3F;color:#fff}
.stage-tools.m .mvi{font-size:14px;letter-spacing:-1px}
@media (max-width:520px){.stage-tools.m .gbtn.mv span:not(.mvi){display:none}}
.dragtip{position:absolute;z-index:6;pointer-events:none;background:#1F4D3F;color:#fff;font:600 13px/1 var(--mono,ui-monospace,monospace);padding:7px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}
#guides .gd{position:absolute;height:0;border-top:calc(1.5px * var(--iz,1)) dashed #E0457B;background:transparent;box-shadow:none}
#guides .gd b{position:absolute;left:50%;bottom:calc(3px * var(--iz,1));transform:translateX(-50%) scale(var(--iz,1));transform-origin:50% 100%;background:#fff;color:#C2185B;font:600 11px/1 var(--sans,system-ui);padding:2px 5px;border-radius:6px;white-space:nowrap}
#guides .gd.eq{border-top-style:solid}
#guides .gd.eq b{background:#E0457B;color:#fff}

/* ===== v16: compact, calmer controls — filled fields, smaller heights, hints behind «?» ===== */
:root{--r:18px;--rc:11px;--tabs-h:46px}
body{font-size:14px}
h2{font-size:24px} h3{font-size:19px}
.top{padding:10px 14px 6px}
.pname{font-size:26px}
.tab{height:32px;padding:0 11px;font-size:13px}
.con{gap:12px}
.card{background:var(--surface);padding:14px;border-radius:var(--r);box-shadow:0 1px 2px rgba(60,44,12,.04),0 8px 22px -16px rgba(60,44,12,.28)}
.card>h2,.card>h3{margin-bottom:8px}
.eyebrow{font-size:10px;letter-spacing:.12em}
.btn{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:var(--rc);box-shadow:none;background:var(--surface2);border-color:transparent}
.btn:hover{border-color:var(--line)}
.btn.ic{width:38px}
.btn.sm{min-height:32px;padding:0 9px;font-size:12.5px}
.btn svg,.gbtn svg{width:17px;height:17px}
.fld{gap:3px}
.fld>.fl{font-size:11px;letter-spacing:.01em}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{min-height:36px;border:1px solid transparent;background:var(--well);box-shadow:none;border-radius:var(--rc);padding:0 10px}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent2);background:var(--surface);outline:none}
.stp{height:36px;border:1px solid transparent;background:var(--well);box-shadow:none;border-radius:var(--rc)}
.stp:focus-within{border-color:var(--accent2);background:var(--surface)}
.stp .sb{width:30px;background:transparent;font-size:17px;color:var(--accent)}
.stp .sb:hover{background:rgba(31,77,63,.07)}
.stp input{font-size:13.5px;font-weight:500}
.seg{padding:2px;gap:2px;border-radius:999px;box-shadow:none;background:var(--well)}
.seg button{min-height:30px;padding:0 11px;font-size:12.5px;border-radius:999px}
.seg button[aria-pressed="true"]{box-shadow:0 2px 6px -3px var(--accent)}
.chip{min-height:32px;padding:0 11px;font-size:12.5px;gap:6px;box-shadow:none;background:var(--surface2);border-color:transparent}
.chips{gap:5px}
.sws{gap:7px}
.sw{width:30px;height:30px}
.sw.big{width:36px;height:36px}
.insp-grid{gap:8px 9px;grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}
.igrp+.igrp{margin-top:10px;padding-top:10px}
.igl{font-size:10.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.foldh{min-height:40px}
.foldt .foldh{min-height:50px}
.card.cardfold{padding-block:4px}
.igrp.fold>.foldb>.foldi>.insp-grid{padding:2px 0 12px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;margin-top:10px}
.tile{min-height:92px;padding:6px 4px;border-radius:13px;font-size:11.5px;box-shadow:none;background:var(--surface2);border-color:transparent}
.tile:hover{border-color:var(--line);box-shadow:0 8px 16px -12px rgba(40,30,8,.5)}
.tile svg,.tile .pv{height:54px}
.lyrs{gap:2px;max-height:340px}
.lyr{border-radius:10px;padding:0;position:relative}
.lyrsel{min-height:36px;padding:0 6px;font-size:13px;gap:8px}
.lyrsel .dot{width:13px;height:13px}
.lyr .btn.ic.sm{width:32px;min-height:32px;background:transparent}
.lgrip{flex:none;width:28px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px}
.lgrip:hover{color:var(--accent);background:var(--well)}
.lyr.lift{z-index:3;background:var(--surface);box-shadow:0 10px 24px -10px rgba(40,30,8,.55);transition:none;cursor:grabbing}
.lyr.dropb::before,.lyr.dropa::after{content:"";position:absolute;left:6px;right:6px;height:3px;border-radius:2px;background:var(--accent2)}
.lyr.dropb::before{top:-2px} .lyr.dropa::after{bottom:-2px}
.lyrhelp{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:6px 0 2px}
.foldn{display:flex;justify-content:flex-end;margin:0 0 2px}
.tiles-note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.hq{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border-radius:50%;border:1.3px solid currentColor;background:transparent;color:var(--muted);font:700 11px/1 var(--f-body);letter-spacing:0;text-transform:none;opacity:.75;position:relative}
.hq::after{content:"";position:absolute;inset:-9px}
.hq:hover{opacity:1;color:var(--accent)}
.tipbox{position:absolute;z-index:200;background:#1F2622;color:#F4F1E8;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;box-shadow:0 14px 34px -12px rgba(0,0,0,.55);animation:pop .16s var(--ease)}
.stats .stat,.grid.stats>*{padding:8px 10px}

/* v17: theme switch in the header, visible on every tab */
body[data-tab=con] .top .acts .btn.ic.thm{display:inline-flex}
.btn.thm{border-radius:50%;background:var(--surface2);color:var(--ink)}
.btn.thm svg{width:18px;height:18px}
:root[data-theme="dark"] .tipbox{background:#2A332D;border:1px solid rgba(255,255,255,.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tipbox{background:#2A332D;border:1px solid rgba(255,255,255,.1)}}
html{transition:background-color .2s}

/* v18: lighter to scroll on tablets — no blur behind glass panels (each one re-reads the page under it on every frame),
   the page tint is part of the body instead of a fixed layer, catalog previews are pictures */
body::before{display:none}
body{background:radial-gradient(900px 520px at 8% -6%,var(--tint1),transparent 62%),radial-gradient(820px 520px at 104% 8%,var(--tint2),transparent 58%),linear-gradient(180deg,var(--bg),var(--bg2));background-color:var(--bg)}
.tabs{-webkit-backdrop-filter:none;backdrop-filter:none;background:color-mix(in srgb,var(--surface) 96%,transparent)}
.gbtn{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,253,249,.93)}
.selbar{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}
#toast{-webkit-backdrop-filter:none;backdrop-filter:none}
.tile img.timg{width:100%;height:54px;object-fit:contain;flex:none;-webkit-user-drag:none;pointer-events:none}
.tile img.timg.onDark{background:linear-gradient(160deg,#9DB3AD,#7C958E);border-radius:10px}

/* v19: project name in the «Проект» window; checks fold in the side panel */
.psave{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.psave .fld input{font-size:15px;font-weight:600}
.chkcard .folds{display:inline-flex;align-items:center;gap:6px}
.chkdot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.chkcard.haswarn .chkdot{background:var(--warn)} .chkcard.hasbad .chkdot{background:var(--bad)}
.chkcard.hasbad .ftt{color:var(--bad)}
.chkcard .chk{margin-top:2px}

/* =================== version 20: Photoshop-style workspace — menu bar, options bar, tools, canvas, dock, status bar =================== */
:root,:root[data-theme="dark"]{
  --bg:#1E1F21; --bg2:#1E1F21; --surface:#2A2C2F; --surface2:#303236; --well:#1A1B1D; --glass:#2A2C2F;
  --ink:#E3E3E0; --muted:#9C9EA3; --line:#3A3D42; --hair:rgba(255,255,255,.08); --hi:transparent;
  --accent:#5DB896; --accent2:#6CC4A2; --accent-ink:#0E1512; --accent-soft:#2C4A3F; --brass:#D9BC74; --chip:#34373B;
  --ok:#7CD4A4; --warn:#F0C36A; --bad:#FF9A8F; --dim:#F0A27A; --skin:#2A2C2F;
  --chrome:#2A2C2F; --chrome2:#303236; --panel:#25272A; --wline:#383B40; --can:#17181A; --sel:#2C4A3F; --hov:#34373B; --acc:#5DB896;
  --sh1:none; --sh2:0 14px 40px -10px rgba(0,0,0,.6); --sh3:0 14px 40px -10px rgba(0,0,0,.7); color-scheme:dark }
:root[data-theme="light"]{
  --bg:#E6E4DF; --bg2:#E6E4DF; --surface:#FAF9F7; --surface2:#F0EEE9; --well:#ECEAE5; --glass:#FAF9F7;
  --ink:#1D2320; --muted:#62635E; --line:#D6D3CC; --hair:rgba(0,0,0,.09); --hi:transparent;
  --accent:#1F6B53; --accent2:#2A7C62; --accent-ink:#FFFFFF; --accent-soft:#D8E6DE; --brass:#8A691C; --chip:#E9E7E1;
  --ok:#1C6E46; --warn:#8A5A00; --bad:#B3261E; --dim:#A3451C; --skin:#E9E4D8;
  --chrome:#F3F2EF; --chrome2:#EAE8E3; --panel:#FAF9F7; --wline:#D6D3CC; --can:#CFCCC4; --sel:#D8E6DE; --hov:#E9E7E1; --acc:#1F6B53;
  --sh1:none; --sh2:0 14px 40px -12px rgba(0,0,0,.28); --sh3:0 14px 40px -12px rgba(0,0,0,.3); color-scheme:light }
html,body{height:100%;overflow:hidden}
body{font-size:12.5px;line-height:1.35;background:var(--bg);overscroll-behavior:none}
body::before{display:none}
h3{font-size:18px}
.ws{display:grid;grid-template-rows:36px 32px minmax(0,1fr) 24px;height:100vh;height:100dvh;min-height:0}
.ws button{-webkit-user-select:none;user-select:none}
/* ---------- menu bar ---------- */
.top{display:flex;align-items:center;gap:3px;padding:0 6px;max-width:none;margin:0;background:var(--chrome);border-bottom:1px solid var(--wline);min-width:0}
.ib{flex:none;width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;color:var(--ink);padding:0}
.ib svg{width:17px;height:17px} .ib.s{width:26px;height:24px} .ib.s svg{width:15px;height:15px}
.ib:hover{background:var(--hov)} .ib[disabled]{opacity:.35;cursor:default;background:transparent} .ib.dng{color:var(--bad)}
.ib[aria-pressed="true"]{background:var(--sel);color:var(--acc)}
.mbar{display:flex;gap:1px;flex:none}
.mb{border:0;background:transparent;font-weight:500;font-size:13px;padding:5px 9px;border-radius:5px;color:var(--ink)}
.mb:hover,.mb[aria-expanded="true"]{background:var(--hov)}
.pn{display:flex;align-items:center;gap:4px;min-width:60px;max-width:230px;flex:0 1 auto;height:24px;padding:0 8px;margin:0 4px;border-inline:1px solid var(--wline)}
.top .pname{font-family:var(--f-body);font-size:13px;font-weight:600;border:0;border-radius:4px;padding:2px 4px;height:22px;width:auto;flex:1;field-sizing:content;max-width:200px;min-width:40px;background:transparent}
.top .pname:hover,.top .pname:focus{background:var(--well);outline:none;border:0}
.pned{color:var(--muted);font-size:11px}
.sp{flex:1;min-width:4px}
.ver{color:var(--muted);font-size:11px;white-space:nowrap;margin-right:4px}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:0;border-radius:5px;background:var(--chrome2);color:var(--ink);font-weight:500;font-size:12.5px;white-space:nowrap}
.pill svg{width:15px;height:15px} .pill:hover{background:var(--hov)}
.pill.pri{background:var(--acc);color:var(--accent-ink);font-weight:600} .pill.pri:hover{filter:brightness(1.08)}
.ib.thm{border-radius:5px}
@media (max-width:900px){.ver{display:none}.pill span{display:none}.pill{padding:0 7px}}
@media (max-width:640px){.pn{display:none}}
/* drop-down menus */
.mpop{position:fixed;z-index:120;min-width:230px;padding:4px;background:var(--panel);border:1px solid var(--wline);border-radius:6px;box-shadow:var(--sh2);display:flex;flex-direction:column}
.mi{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border:0;background:transparent;border-radius:4px;text-align:left;font-size:12.5px;color:var(--ink);cursor:pointer;position:relative;white-space:nowrap}
.mi:hover{background:var(--sel)} .mi[disabled]{opacity:.4;cursor:default;background:transparent}
.mi span{flex:1} .mi kbd{font:11px var(--f-mono);color:var(--muted)}
.mck{width:16px;font-style:normal;text-align:center;color:var(--acc);flex:none}
.mi input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mpop hr{border:0;border-top:1px solid var(--wline);margin:4px 2px}
/* ---------- options bar ---------- */
.opt{display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--chrome2);border-bottom:1px solid var(--wline);min-width:0;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.opt::-webkit-scrollbar{display:none}
.onm{font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;flex:none}
.ohint{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.opt .sep{width:1px;height:18px;background:var(--wline);flex:none}
.nf{display:inline-flex;align-items:center;height:24px;border:1px solid var(--wline);border-radius:4px;background:var(--well);overflow:hidden;flex:none}
.nf:focus-within{border-color:var(--acc)}
.nf b{font-weight:500;color:var(--muted);padding:0 7px;height:100%;display:flex;align-items:center;background:var(--chrome);border-right:1px solid var(--wline);cursor:ew-resize;touch-action:none;-webkit-user-select:none;user-select:none;min-width:24px;justify-content:center}
.nf b:hover,body.scrubbing .nf b{color:var(--acc)}
.nf input{width:58px;height:100%;border:0;background:transparent;padding:0 6px;text-align:right;font:500 12px/1 var(--f-mono);-moz-appearance:textfield;appearance:textfield;color:var(--ink)}
.nf input::-webkit-outer-spin-button,.nf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nf input:focus{outline:none}
body.scrubbing,body.scrubbing *{cursor:ew-resize!important}
@media (max-width:1100px){.ohint.om{display:none}}
/* ---------- workspace ---------- */
main#view{max-width:none;margin:0;padding:0;min-height:0;overflow:hidden}
.wsm{display:grid;grid-template-columns:40px minmax(0,1fr) 276px;height:100%;min-height:0}
.wsm.mini{grid-template-columns:40px minmax(0,1fr) 38px}
@media (min-width:1300px){.wsm{grid-template-columns:40px minmax(0,1fr) 310px}}
.tools{background:var(--chrome);border-right:1px solid var(--wline);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow-y:auto;scrollbar-width:none;min-height:0}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;position:relative;color:var(--ink);padding:0}
.tb svg{width:19px;height:19px} .tb:hover{background:var(--hov)}
.tb[aria-pressed="true"]{background:var(--sel);color:var(--acc)}

U.area = function(bind,label,val,o){o=o||{};return '<label class="fld'+(o.cls?' '+o.cls:'')+'"><span class="fl">'+label+'</span><textarea rows="'+(o.rows||2)+'" id="f-'+bind.replace(/\./g,'-')+'" data-bind="'+bind+'">'+U.esc(val==null?'':val)+'</textarea></label>'};
/* In the side panel a row of choices that would not fit its column becomes a drop-down list: nothing scrolls sideways there. */
U.SEGW = 158;   // px left for the control in a 276 px dock: 276 − 2×8 padding − 88 label − 6 gap − 8 scrollbar
U.segWide = function(opts){var w=4;opts.forEach(function(p){w+=String(p[1]).replace(/<[^>]*>/g,'').length*6.7+15});return w>U.SEGW};
U.seg = function(bind,val,opts,o){o=o||{};

    return '<span class="dsel"><select data-pick="'+bind+'"'+(num?' data-n="1"':'')+' id="pk-'+bind.replace(/\./g,'-')+'">'+(hit?'':'<option value="" selected disabled>—</option>')+
      opts.map(function(p){return '<option value="'+U.esc(String(p[0]))+'"'+(String(val)===String(p[0])?' selected':'')+'>'+String(p[1]).replace(/<[^>]*>/g,'')+'</option>'}).join('')+'</select></span>'}

/* ---------- drawings ---------- */
var DR = {};
function r1(v){return Math.round(v*10)/10}
DR.txt = function(x,y,s,u,cls,o){o=o||{};var fs=(o.fs||11)*u;return '<text class="'+(cls||'')+(o.halo===false?'':' halo')+'" x="'+r1(x)+'" y="'+r1(y)+'" font-size="'+r1(fs)+'" text-anchor="'+(o.anchor||'middle')+'"'+(o.halo===false?'':' stroke-width="'+r1(3*u)+'"')+(o.rot?' transform="rotate('+o.rot+' '+r1(x)+' '+r1(y)+')"':'')+(o.bold?' font-weight="600"':'')+'>'+s+'</text>'};
DR.dimH = function(x1,x2,y,s,u,below){var t=4*u;return '<path class="dm" d="M'+r1(x1)+','+r1(y)+' L'+r1(x2)+','+r1(y)+' M'+r1(x1-t)+','+r1(y+t)+' L'+r1(x1+t)+','+r1(y-t)+' M'+r1(x2-t)+','+r1(y+t)+' L'+r1(x2+t)+','+r1(y-t)+'"/>'+DR.txt((x1+x2)/2,y+(below?13*u:-4*u),s,u,'d')};
DR.dimV = function(x,y1,y2,s,u,right){var t=4*u,tx=x+(right?13*u:-4*u);return '<path class="dm" d="M'+r1(x)+','+r1(y1)+' L'+r1(x)+','+r1(y2)+' M'+r1(x-t)+','+r1(y1+t)+' L'+r1(x+t)+','+r1(y1-t)+' M'+r1(x-t)+','+r1(y2+t)+' L'+r1(x+t)+','+r1(y2-t)+'"/>'+DR.txt(tx,(y1+y2)/2,s,u,'d',{rot:-90})};
DR.svg = function(vb,wpx,body,cls,label){return '<svg class="dw'+(cls?' '+cls:'')+'" viewBox="'+vb.map(r1).join(' ')+'" style="width:'+Math.round(wpx)+'px" role="img" aria-label="'+U.esc(label||'Чертёж')+'">'+body+'</svg>'};
/* scale so that the drawing fits Wc x Hc CSS px; returns mm per px */
DR.unit = function(w,h,padX,padY,Wc,Hc){return 1/Math.min((Wc-padX)/w,(Hc-padY)/h)};

/* frame of one module, front view from the back side of the skin */
DR.module = function(m,R){
  var el=m.el,g=m.g,b=R.b,w=el.w,h=el.h,u=DR.unit(w,h,150,80,560,560),pl=78*u,pr=72*u,pt=20*u,pb=60*u,s='',Y=function(y){return h-y};
  s+='<path class="o" d="'+SC.bgPath(el)+'"'+((el.type==='uarch'||el.type==='portal')?' fill-rule="evenodd"':'')+'/>';
  m.mem.forEach(function(q){
    if(q.k==='arc'){var x1=q.cx+q.r*Math.cos(q.a0),y1=q.cy+q.r*Math.sin(q.a0),xm=q.cx+q.r*Math.cos((q.a0+q.a1)/2),ym=q.cy+q.r*Math.sin((q.a0+q.a1)/2),x2=q.cx+q.r*Math.cos(q.a1),y2=q.cy+q.r*Math.sin(q.a1);

      else s+='<path class="m" stroke-width="'+b+'" d="M'+r1(x1)+','+r1(Y(y1))+' A'+q.r+','+q.r+' 0 0 0 '+r1(xm)+','+r1(Y(ym))+' A'+q.r+','+q.r+' 0 0 0 '+r1(x2)+','+r1(Y(y2))+'"/>'}
    else s+='<line class="m'+(Math.abs(q.x1-q.x2)<1?' v':'')+'" stroke-width="'+b+'" x1="'+r1(q.x1)+'" y1="'+r1(Y(q.y1))+'" x2="'+r1(q.x2)+'" y2="'+r1(Y(q.y2))+'"/>'});
  // spacer axes and support axes
  R.pairs.forEach(function(p){var mm=p.front===m?p.rear:(p.rear===m?p.front:null);if(!mm)return;var lx=p.gx-m.x0;
    s+='<line class="ax" x1="'+lx+'" y1="'+r1(-8*u)+'" x2="'+lx+'" y2="'+h+'"/>';
    p.heights.forEach(function(hh){s+='<circle class="ac" cx="'+lx+'" cy="'+Y(hh)+'" r="'+r1(4.5*u)+'"/>'});
    s+=DR.txt(lx,-10*u,'⌀ '+mm.label,u,'a',{fs:10})});
  m.sup.axes.forEach(function(ax){s+='<path class="ac" d="M'+r1(ax)+','+r1(h+3*u)+' l'+r1(6*u)+','+r1(10*u)+' l'+r1(-12*u)+',0 Z"/>'});
  // part labels: first member of each parts row
  var seen={};

    if(q.k==='arc'){var am=(q.a0+q.a1)/2+(q.pos==='Ж'?0:.5);s+=DR.txt(q.cx+q.r*Math.cos(am),Y(q.cy+q.r*Math.sin(am))+4*u,q.pos+' '+q.len,u,'',{fs:10,bold:true})}
    else{var vx=Math.abs(q.x1-q.x2)<1,mx=(q.x1+q.x2)/2,my=(q.y1+q.y2)/2;s+=DR.txt(mx+(vx?3.5*u:0),Y(my)+(vx?0:3.5*u),q.pos+' '+q.len,u,'',{fs:10,bold:true,rot:vx?-90:0})}});
  // dimensions
  s+='<line class="fl" x1="'+r1(-pl*.6)+'" y1="'+h+'" x2="'+r1(w+pr*.6)+'" y2="'+h+'"/>';

  // whether images may be sent is reported by the call itself.
  try{window.claude.use('sample').then(function(s){IO.sample=s||null;IO.sampleState=s?'ok':'none';if(onChange)onChange();
      if(s&&s.limits)s.limits().then(function(l){IO.sampleImg=!!(l&&l.images);if(onChange)onChange()},function(){})},function(){IO.sampleState='none';if(onChange)onChange()})}catch(e){IO.sampleState='none'}

/* ---------- saving a generated file ---------- */
IO.dataUrlBlob = function(url){var i=url.indexOf(','),mime=(url.slice(5,i).split(';')[0])||'image/jpeg',bin=atob(url.slice(i+1)),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})};
IO.blobToDataURL = function(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(blob)})};
IO.save = function(filename,data,kind){
  var fallback=function(){
    if(kind==='img')return IO.blobToDataURL(data).then(function(url){openModal({type:'img',title:filename,src:url,note:'Сохранение файлов в этом окне недоступно. Нажмите на картинку и удерживайте (или правой кнопкой) → «Сохранить изображение».'})});
    if(kind==='text')return openModal({type:'text',title:filename,text:String(data).replace(/^\ufeff/,''),note:'Сохранение файлов в этом окне недоступно. Скопируйте текст и вставьте в файл с таким именем.'});
    toast('Сохранение файлов в этом окне недоступно. Откройте страницу на claude.ai.');
  };
  if(!IO.dl){fallback();return Promise.resolve(false)}
  return IO.dl.save({filename:filename,data:data}).then(function(){toast('Сохранено: '+filename);return true},function(e){
    var c=e&&e.code;
    if(c==='declined'){toast('Сохранение отменено');return false}
    if(c==='rate_limited'){toast('Окно сохранения уже открыто. Повторите через пару секунд.');return false}
    if(c==='too_large'){toast('Файл слишком большой для сохранения.');return false}
    if(c==='rejected_extension'||c==='extension_not_enabled'){toast('Этот формат здесь сохранить нельзя.');return false}
    fallback();return false;
  });
};

/* ---------- fonts for canvas drawing ---------- */
IO.fonts = function(){
  if(IO._fonts)return IO._fonts;
  var want=['700 40px "Cormorant Garamond"','400 20px "Onest"','700 20px "Onest"'].concat(D.FONT_LIST.map(function(f){return f[3]+' 40px "'+f[1]+'"'}));
  var all=(document.fonts&&document.fonts.load)?Promise.all(want.map(function(f){return document.fonts.load(f,'AБЯ ab 12').catch(function(){})})):Promise.resolve();
  IO._fonts=Promise.race([all,new Promise(function(r){setTimeout(r,2500)})]);

};
IO.svgImage = function(svg){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){rej(new Error('svg image'))};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})};

/* ---------- the scene as a bitmap. Inscriptions are drawn with canvas text so that web fonts survive. ---------- */
IO.drawText = function(c,el,k){
  var pal=D.pal(S.palette),px=el.size/0.66,lines=String(el.text||'').split('\n'),mq=el.style==='marquee',col=el.color||(el.style==='flat'?'#1B1F1D':mq?'#F5EFE3':pal.ink),lh=px*1.04,x0=0,y0=0,cx=el.w/2,pb=SC.proj(S,el);
  c.save();c.scale(k,k);c.translate(pb.x,pb.y);c.scale(pb.s,pb.s);k*=pb.s;if(el.rot){var ccx=x0+el.w/2,ccy=y0+el.h/2;c.translate(ccx,ccy);c.rotate(el.rot*Math.PI/180);c.translate(-ccx,-ccy)}c.textAlign='center';c.textBaseline='alphabetic';
  c.font=(mq?700:(D.FONT_W[el.font]||600))+' '+px+'px '+(mq?D.FONTS.sans:D.FONTS[el.font]);
  var ls=(el.style==='neon'&&!D.FONT_SCRIPT[el.font])||mq;
  try{if('letterSpacing' in c)c.letterSpacing=ls?(px*(mq?.08:.06))+'px':'0px'}catch(e){}
  lines.forEach(function(l,i){var ty=y0+lh*(i+.78);
    if(mq){c.fillStyle=SC.dark(col,.35);c.fillText(l,cx+px*.04,ty+px*.04);c.fillStyle=col;c.fillText(l,cx,ty);c.save();c.setLineDash([0,px*.115]);c.lineCap='round';c.lineWidth=px*.05;c.strokeStyle='#FFF1C4';c.shadowColor='#FFE3A0';c.shadowBlur=18*k;c.strokeText(l,cx,ty);c.restore()}
    else if(el.style==='neon'){c.shadowColor=col;c.shadowBlur=34*k;c.fillStyle=SC.lite(col,SC.lum(col)>.6?.6:.2);c.fillText(l,cx,ty);c.shadowBlur=14*k;c.fillText(l,cx,ty)}
    else if(el.style==='gold'){var g=c.createLinearGradient(x0,y0,x0+el.w,y0+el.h);g.addColorStop(0,'#F0DDA0');g.addColorStop(.5,'#C9A857');g.addColorStop(1,'#9C7B34');
      c.shadowColor='rgba(27,20,8,.35)';c.shadowBlur=18*k;c.shadowOffsetX=10*k;c.shadowOffsetY=8*k;c.fillStyle=g;c.fillText(l,cx,ty)}
    else{c.fillStyle=col;c.fillText(l,cx,ty)}
  });
  c.restore();
};
IO.sceneCanvas = function(px,opt){
  opt=opt||{};
  var used=SC.usedImgs(S),idefs=SC.imgDefs(used);
  var key=px+'|'+JSON.stringify([S.els,S.palette,S.room,S.floor,S.balloons,opt.dims?S.show:0,used.map(function(id){return IMG[id]?1:0})]);
  if(IO._sc&&IO._sc.key===key)return Promise.resolve(IO._sc.cv);
  // the picture ends a little below the nearest thing on the floor: no empty floor at the bottom
  var zm=E.zMap(S),zn=0;S.els.forEach(function(e){if(!e.hide)zn=Math.max(zn,zm[e.id]||0)});
  var W=S.room.w,H=Math.round(Math.min(S.room.h+SC.FLOOR,Math.max(SC.floorY(S,Math.min(SC.ZMAX,zn+400))+80,S.room.h+300))),k=px/W,cv=document.createElement('canvas');cv.width=px;cv.height=Math.round(H*k);
  var c=cv.getContext('2d'),n=S.els.length,runs=[],i=0,first=true,ord=SC.order(S);   // runs follow the drawing order: far to near
  while(first||i<n){var j=i;while(j<n&&S.els[ord[j]].type!=='text')j++;
    if(first||j>i)runs.push({svg:[i,j,first]});
    if(j<n){var tj=S.els[ord[j]];if(!tj.hide){if(tj.stand)runs.push({svg:[j,j+1,false],base:true});runs.push({text:tj})}j++}
    first=false;i=j}
  var showDims=!!opt.dims&&S.show.dims;if(showDims)runs.push({svg:[n,n,false],dims:true});
  var uidn=0,chain=IO.fonts();
  runs.forEach(function(r){chain=chain.then(function(){
    if(r.text){IO.drawText(c,r.text,k);return}
    var svg='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+cv.width+'" height="'+cv.height+'" viewBox="0 0 '+W+' '+H+'">'+(idefs?'<defs>'+idefs+'</defs>':'')+SC.render(S,R,{uid:'x'+(uidn++),from:r.svg[0],to:r.svg[1],noRoom:!r.svg[2],dims:!!r.dims,grid:!!opt.dims&&S.show.grid,base:!!r.base})+'</svg>';
    return IO.svgImage(svg).then(function(im){c.drawImage(im,0,0,cv.width,cv.height)})})});
  return chain.then(function(){IO._sc={key:key,cv:cv};return cv});
};
IO.canvasBlob = function(cv,type,q){return new Promise(function(res,rej){try{cv.toBlob(function(b){b?res(b):rej(new Error('blob'))},type||'image/png',q)}catch(e){rej(e)}})};

};

/* ---------- the client offer, one A4 page drawn on a canvas (1240 x 1754 at scale 1) ---------- */
IO.wrap = function(c,text,maxW){var out=[];String(text).split('\n').forEach(function(par){var words=par.split(/\s+/),line='';
  words.forEach(function(w){var t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out};
IO.drawOffer = function(cv,scale){
  if(!cv)return Promise.resolve();
  var tok=++IO._ot,o=V.offer(),k=scale||1,W=1240,Hh=1754,mx=84,cw=W-2*mx;
  return IO.sceneCanvas(2144).then(function(sc){
    if(tok!==IO._ot)return cv;
    if(cv.width!==W*k||cv.height!==Hh*k){cv.width=W*k;cv.height=Hh*k}
    var c=cv.getContext('2d');c.setTransform(k,0,0,k,0,0);
    var disp="'Cormorant Garamond', Georgia, serif",body="'Onest', Arial, sans-serif",ink='#1E2420',mu='#69685E',brass='#8F6D1F',em='#1F4D3F';
    function sp(v){try{if('letterSpacing' in c)c.letterSpacing=v}catch(e){}}
    function eyebrow(t,x,y,al){c.font='600 15px '+body;c.fillStyle=brass;c.textAlign=al||'left';sp('2px');c.fillText(t.toUpperCase(),x,y);sp('0px')}
    c.fillStyle='#fff';c.fillRect(0,0,W,Hh);c.textBaseline='alphabetic';
    c.font='600 52px '+disp;c.fillStyle=em;c.textAlign='left';c.fillText(o.brand,mx,128);
    eyebrow('Коммерческое предложение',W-mx,106,'right');c.font='400 18px '+body;c.fillStyle=mu;c.textAlign='right';c.fillText('от '+o.today,W-mx,132);
    c.fillStyle='#DDD3BF';c.fillRect(mx,150,cw,1);
    // scene
    var ih=Math.min(600,cw*sc.height/sc.width),iw=ih*sc.width/sc.height,ix=mx+(cw-iw)/2,iy=174,rr=14;
    c.save();c.beginPath();c.moveTo(ix+rr,iy);c.arcTo(ix+iw,iy,ix+iw,iy+ih,rr);c.arcTo(ix+iw,iy+ih,ix,iy+ih,rr);c.arcTo(ix,iy+ih,ix,iy,rr);c.arcTo(ix,iy,ix+iw,iy,rr);c.closePath();c.clip();c.drawImage(sc,ix,iy,iw,ih);c.restore();
    var y=iy+ih+62;
    c.font='600 46px '+disp;c.fillStyle=ink;c.textAlign='left';var tl=IO.wrap(c,o.title,cw).slice(0,2);tl.forEach(function(l){c.fillText(l,mx,y);y+=50});
    c.font='500 21px '+body;c.fillStyle=brass;c.fillText(o.sub,mx,y-10);y+=46;
    // columns
    var lx=mx,lw=440,rx=mx+490,rw=cw-490,yl=y,yr=y;
    function rows(list,x,w,y0,bullet){c.font='400 21px '+body;c.fillStyle=ink;c.textAlign='left';list.forEach(function(t){var ls=IO.wrap(c,t,w-(bullet?24:0));ls.forEach(function(l,i){if(bullet&&i===0){c.fillStyle=em;c.beginPath();c.arc(x+6,y0-7,4,0,6.3);c.fill();c.fillStyle=ink}c.fillText(l,x+(bullet?24:0),y0);y0+=30});y0+=7});return y0}
    var who=[];if(o.who)who.push('Для: '+o.who);if(o.date)who.push('Дата: '+o.date);if(o.place)who.push('Место: '+o.place);
    if(who.length){eyebrow('Мероприятие',lx,yl);yl=rows(who,lx,lw,yl+34)+18}
    eyebrow('Что нужно на площадке',lx,yl);yl=rows(o.site,lx,lw,yl+34,true);
    eyebrow('Что входит',rx,yr);var incl=o.incl.length>9?o.incl.slice(0,8).concat(['и другое по эскизу']):o.incl;yr=rows(incl,rx,rw,yr+34,true);
    // price block
    var by=Math.min(Math.max(Math.max(yl,yr)+20,1300),1400),bh=176;
    c.fillStyle='#F5F0E6';c.beginPath();c.moveTo(mx+rr,by);c.arcTo(mx+cw,by,mx+cw,by+bh,rr);c.arcTo(mx+cw,by+bh,mx,by+bh,rr);c.arcTo(mx,by+bh,mx,by,rr);c.arcTo(mx,by,mx+cw,by,rr);c.closePath();c.fill();
    eyebrow('Стоимость',mx+30,by+42);
    c.font='600 78px '+disp;c.fillStyle=ink;c.textAlign='left';c.fillText(U.n(o.price,o.price%1?2:0).replace(/\u00a0/g,' ')+' €',mx+30,by+116);
    c.font='400 17px '+body;c.fillStyle=mu;c.fillText(o.vatNote,mx+30,by+150);
    c.textAlign='right';c.font='400 21px '+body;c.fillStyle=ink;var ty=by+70;
    if(o.depositPct){c.fillText('Предоплата '+o.depositPct+' %: '+U.n(o.deposit,2).replace(/\u00a0/g,' ')+' €',mx+cw-30,ty);ty+=36}
    c.fillText('Предложение действует до '+o.until,mx+cw-30,ty);
    // note and contacts
    var ny=by+bh+40;c.textAlign='left';c.font='400 18px '+body;c.fillStyle=mu;
    if(o.note)IO.wrap(c,o.note,cw).slice(0,3).forEach(function(l){if(ny<Hh-126){c.fillText(l,mx,ny);ny+=26}});
    c.fillStyle='#DDD3BF';c.fillRect(mx,Hh-112,cw,1);
    c.font='400 18px '+body;c.fillStyle=ink;var cl=o.contacts?IO.wrap(c,o.contacts,cw).slice(0,2):[o.brand];cl.forEach(function(l,i){c.fillText(l,mx,Hh-80+i*25)});
    return cv;
  }).catch(function(){var c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#69685E';c.font='28px sans-serif';c.textAlign='center';c.fillText('Предпросмотр недоступен в этом браузере',cv.width/2,200);return cv});
};

/* ---------- estimate as CSV (semicolon, decimal comma: opens correctly in Excel with German or Russian locale) ---------- */
IO.csv = function(){
  var q=function(v){v=String(v==null?'':v).replace(/\u00a0/g,' ');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},num=function(v){return String(Math.round(v*100)/100).replace('.',',')};
  var L=[['Группа','Позиция','Описание','Кол-во','Ед.','Цена, EUR','Сумма, EUR'].join(';')];
  R.bom.forEach(function(g){g.rows.forEach(function(r){L.push([q(g.name),q(r.name),q(r.spec),num(r.qty),q(r.unit),num(r.price),num(r.sum)].join(';'))});L.push([q(g.name),'Итого по группе','','','','',num(g.sum)].join(';'))});
  L.push(['','Конструкция','','','','',num(R.cost.constr)].join(';'));L.push(['','Шары и гирлянда','','','','',num(R.cost.bal)].join(';'));L.push(['','Набор декора','','','','',num(R.cost.kit)].join(';'));L.push(['','ИТОГО','','','','',num(R.cost.all)].join(';'));
  return '\ufeff'+L.join('\r\n');
};

IO.dbErr = function(e){var c=e&&e.code;toast(c==='quota_exceeded'?'Хранилище заполнено: удалите старые проекты.':c==='invalid_argument'?'Нет прав на запись в хранилище этой страницы.':'Облачное хранилище сейчас недоступно.')};
IO.listProjects = function(){
  if(!IO.db)return Promise.resolve(null);
  return IO.db.collection('projects').get().then(function(q){return q.docs.map(function(d){var x=d.data()||{};return {id:d.id,name:String(x.name||'Без названия'),updated:String(x.updated||''),n:+x.n||0,json:x.json}}).sort(function(a,b){return a.updated<b.updated?1:-1})},function(e){IO.dbErr(e);return null});

IO.saveProject = function(){
  if(!IO.db)return Promise.resolve(false);
  if(!S.pid)S.pid='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  // pictures first, one document each and only once per session, then the project itself
  var chain=Promise.resolve();
  SC.usedImgs(S).forEach(function(id){var im=IMG[id];if(!im||IO._cloud[id])return;chain=chain.then(function(){return IO.db.collection('images').doc(id).set({src:im.src,w:im.w,h:im.h}).then(function(){IO._cloud[id]=1})})});
  return chain.then(function(){return IO.db.collection('projects').doc(S.pid).set({name:S.name,updated:new Date().toISOString(),n:S.els.length,json:JSON.stringify(S)})}).then(function(){toast('Проект «'+S.name+'» сохранён');return true},function(e){IO.dbErr(e);return false});
};
IO.fetchCloudImgs = function(ids){
  var need=ids.filter(function(id){return !IMG[id]});if(!IO.db||!need.length)return Promise.resolve(0);
  return Promise.all(need.map(function(id){return IO.db.collection('images').doc(id).get().then(function(d){var x=d.exists&&d.data();if(x&&/^data:image\//.test(x.src)&&+x.w>0&&+x.h>0){IMG[id]={src:String(x.src),w:+x.w,h:+x.h};IO._cloud[id]=1;IO.saveImg(id);return 1}return 0},function(){return 0})})).then(function(r){return r.reduce(function(a,b){return a+b},0)});
};

/* ---------- my library: templates (elements or a whole scene) and figures, kept in this browser and, when the page can, in its cloud storage ---------- */
IO.LKEY = 'fotozona.lib.v1';
IO.lib = [];

  S.els.forEach(function(o){if(o===el||o.hide||o.type!=='prop'||!STANDS[o.kind]||cx<o.x||cx>o.x+o.w||Math.abs(SC.zOf(S,o)-ze)>300)return;var top=standTop(o,cx);if(top===null)return;var d=Math.abs(el.y-top);if(d<bd){bd=d;best=top;bo=o}});
  if(best!==null){el.y=Math.round(best);el.z=Math.min(E.ZMAX,SC.zOf(S,bo)+1);var s2=SC.sc(el.z),g=$('#guides');if(g)g.innerHTML='<i class="gh" style="top:'+((S.room.h-(SC.CAM.h+(best-SC.CAM.h)*s2))/(S.room.h+SC.FLOOR)*100).toFixed(3)+'%"></i>'}return bo}

function libItemOf(list,name,kind){
  var it={id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind:kind,name:name,created:new Date().toISOString(),imgs:[]};
  if(kind==='scene'){var o=JSON.parse(JSON.stringify(S));['prices','eco','client','brand','pid','ref'].forEach(function(q){delete o[q]});o.name=name;it.json=JSON.stringify(o);it.n=o.els.length;it.imgs=SC.usedImgs(o)}
  else{var b=bboxOf(list),els=list.map(function(e){var c=JSON.parse(JSON.stringify(e));c.x-=b.x0;delete c.hide;delete c.lock;return c});it.json=JSON.stringify(els);it.n=els.length;
    els.forEach(function(e){[e.im,e.type==='pic'?e.im0:null].forEach(function(id){if(id&&it.imgs.indexOf(id)<0&&IMG[id])it.imgs.push(id)})})}
  return it;
}
function libInsert(it){UI.fly=false;
  var go=function(){
    if(it.kind==='pic'){addPic(it.imgs[0],{name:it.name});return}
    var els=null;try{els=JSON.parse(it.json)}catch(e){}if(!Array.isArray(els)||!els.length){toast('Шаблон повреждён.');return}
    var o=M.normalize({els:els,room:S.room,palette:S.palette});if(!o||!o.els.length){toast('Шаблон повреждён.');return}
    var w=bboxOf(o.els).x1,mn=M.main(S),cx=mn?mn.x+mn.w/2:S.room.w/2,dx=Math.round(cx-w/2),ids=[];
    o.els.forEach(function(e){e.id=M.uid();e.x+=dx;M.clamp(S,e);ids.push(e.id);
      if(E.isBg(e)){var last=-1;S.els.forEach(function(q,qi){if(E.isBg(q))last=qi});S.els.splice(last+1,0,e)}else S.els.push(e)});
    if(ids.length>1){UI.multi=ids;UI.sel=null}else{UI.sel=ids[0];UI.multi=null}UI.ced=null;syncImgDefs();commit();toast('Добавлено из моих: «'+it.name+'»');
  };
  var miss=it.imgs.filter(function(id){return !IMG[id]});IO.loadImgs(miss);miss=miss.filter(function(id){return !IMG[id]});
  if(miss.length&&IO.db)IO.fetchCloudImgs(miss).then(function(){syncImgDefs();go()});else go();
}

function isColorBind(b){return /\.(color|insColor|wall|floorC|rib|lc)$/.test(b)||/\.cols(\.\d)?$/.test(b)}
/* hex = '' returns the colour to the palette; cmyk keeps the numbers exactly as they were typed */
function setColor(bind,hex,cmyk){
  var p=bind.split('.'),root=p.shift(),o=root==='e'?V.sel():S,key=p.join('.');if(!o)return;
  if(p[0]==='cols'){
    if(p.length===1){delete o.cols;if(o.k)Object.keys(o.k).forEach(function(q){if(q.indexOf('cols.')===0)delete o.k[q]});return}
    if(!o.cols){var pl0=D.pal(S.palette);o.cols=o.type==='flora'?[pl0.bal[3],pl0.c[3],pl0.bal[4],pl0.bal[3],pl0.c[3]]:pl0.bal.slice()}if(hex)o.cols[+p[1]]=hex;
  } else {var t=o;while(p.length>1)t=t[p.shift()];if(hex)t[p[0]]=hex;else if(root==='s')t[p[0]]='';else delete t[p[0]]}
  if(cmyk){o.k=o.k||{};o.k[key]=cmyk}else if(o.k)delete o.k[key];
  if(bind==='e.color'&&hex&&(o.surf==='sequin'||o.surf==='foil'))o.seq='custom';
}
function applyBind(path,val){
  var p=path.split('.'),root=p.shift(),k=p[0];
  if(root==='u'){if(k==='group'){var same=UI.fly&&V.toolOf(UI.group)[0]===V.toolOf(val)[0];UI.group=val;UI.fly=!same;UI.tool=null;render();return}UI[k]=val;render();return}
  if(root==='g'){var L=V.multi().filter(function(e){return !e.lock});if(L.length<1)return;var b=gbox(L),v=+val;if(!isFinite(v))return;
    if(k==='x')shiftGroupX(L,Math.round(v-b.x0));
    else if(k==='y')L.forEach(function(e){if(!M.floorOnly(e))e.y=Math.max(0,e.y+Math.round(v-b.y0))});
    else if(k==='z')L.forEach(function(e){setZ(e,SC.zOf(S,e)+Math.round(v-b.z))});
    else if(k==='w'||k==='h'){var s=v/(k==='w'?b.x1-b.x0:b.y1-b.y0);if(!(s>0))return;s=Math.max(.2,Math.min(5,s));scaleGroup(L,L.map(function(e){return JSON.parse(JSON.stringify(e))}),s,b.x0,b.y0)}
    L.forEach(function(e){M.clamp(S,e)});if(!UI.scrubbing)UI.nextLabel=k==='w'||k==='h'?'Размер группы: '+L.length+' эл.':'Перемещение группы: '+L.length+' эл.';commit();return}
  if(root==='p'){if(val===''||!isFinite(val)||val===D.PRICE[k])delete S.prices[k];else S.prices[k]=Math.max(0,val);commit();return}
  if(path==='s.ref.tall'){rescaleScene(+val);commit();return}
  if(isColorBind(path)){setColor(path,val,null);if(root==='e'){var ce=V.sel();if(ce){M.fit(ce)}}commit();return}

      if(ck==='a'||ck==='ф'){ev.preventDefault();selectAll();return}
      if(ck==='c'||ck==='с'){if(clipCopy(false))ev.preventDefault();return}
      if(ck==='x'||ck==='ч'){if(clipCopy(true))ev.preventDefault();return}
      if(ck==='v'||ck==='м'){ev.preventDefault();clipPaste();return}
      if(ck==='d'||ck==='в'){ev.preventDefault();act(V.multi().length>1?'gdup':'dup');return}}
    var gm=V.multi();if(gm.length>1){
      if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();act('gdel');return}
      var gd={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[ev.key];
      if(gd){ev.preventDefault();var gs=ev.shiftKey?10:50,gu=gm.filter(function(e){return !e.lock});if(gd[0])shiftGroupX(gu,gd[0]*gs);gu.forEach(function(e){if(gd[1]){if(UI.mv==='floor')setZ(e,SC.zOf(S,e)-gd[1]*gs);else if(!M.floorOnly(e))e.y=Math.max(0,e.y+gd[1]*gs)}});UI.nextLabel='Перемещение группы: '+gu.length+' эл.';commit()}
      return}
    var el=V.sel();if(!el)return;
    if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();act('del');return}
    var d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[ev.key];
    if(d){ev.preventDefault();var s=ev.shiftKey?10:50;el.x+=d[0]*s;if(d[1]){if(UI.mv==='floor')setZ(el,SC.zOf(S,el)-d[1]*s);else el.y+=d[1]*s}M.clamp(S,el);commit()}
  });
  window.addEventListener('resize',function(){placeOv()});
  IO.init(function(){if(IO.db&&!IO._libSynced){IO._libSynced=1;IO.libSync().then(function(ch){if(ch){IO.loadImgs(IO.libImgs());render()}})}if(UI.modal&&UI.modal.type==='menu'){renderModal();refreshProjects()}else if(UI.modal){renderModal();if(UI.modal.type==='photo'&&IO.db&&UI.analyses===null)refreshAnalyses()}});
  IO.fonts().then(function(){var ch=false;S.els.forEach(function(e){if(e.type==='text'){var w=e.w;M.fit(e);if(e.w!==w)ch=true}});V._tiles={};if(ch){calc();UI.hist[UI.hi]=JSON.stringify(S)}render()});
}
init();
